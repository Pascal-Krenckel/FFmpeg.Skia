name: Documentation

# API documentation on GitHub Pages (Settings > Pages > Source: GitHub Actions).
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore Release
        run: dotnet restore FFmpeg.Skia/FFmpeg.Skia.csproj -p:Configuration=Release

      # The documented API is the same for FFmpeg 8 and 9; the default (9) is built.
      # The dependencies are copied next to FFmpeg.Skia.dll so DocFX can resolve FFmpeg and SkiaSharp types.
      - name: Build Release
        run: dotnet build FFmpeg.Skia/FFmpeg.Skia.csproj -c Release --no-restore -p:GeneratePackageOnBuild=false -p:CopyLocalLockFileAssemblies=true

      - name: Install DocFX
        run: dotnet tool install -g docfx

      - name: Build documentation
        run: docfx docfx.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
